name: build-linux-rpm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  services-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests -q

  rpm:
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          dnf install -y python3 python3-pip rpm-build nodejs npm git
          python3 -m pip install -r services/requirements.txt
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build rpm
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          cp -a services ~/rpmbuild/SOURCES/services
          cp -a frontend/dist ~/rpmbuild/SOURCES/frontend
          cp packaging/linux/fstec-gateway.service packaging/linux/fstec-worker@.service \
             packaging/linux/fstec-service.desktop packaging/linux/fstec-service.png ~/rpmbuild/SOURCES/
          rpmbuild -bb --define "_sourcedir $HOME/rpmbuild/SOURCES" \
            --define "_topdir $HOME/rpmbuild" packaging/linux/fstec-service.spec
      - name: Upload rpm
        uses: actions/upload-artifact@v4
        with:
          name: fstec-service-rpm
          path: ~/rpmbuild/RPMS/**/*.rpm