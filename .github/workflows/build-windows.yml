name: build-windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    name: Build backend (PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          (Get-Content backend/requirements.txt | Where-Object { $_ -notmatch 'greenlet' }) | Set-Content backend/requirements-win.txt
          pip install greenlet pyinstaller
          pip install -r backend/requirements-win.txt
      - name: Build
        run: "cd backend && python -m PyInstaller backend.spec --noconfirm"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-windows
          path: backend/dist/fstec-backend
          if-no-files-found: error

  package:
    name: Build NSIS + MSI
    needs: backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: backend-windows
          path: backend/dist/fstec-backend
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Build Tauri
        run: npx tauri build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: fstec-service-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  verify:
    name: Verify installers
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fstec-service-windows
          path: installers
      - name: Check artifacts
        run: |
          Write-Output "=== Downloaded installers ==="
          Get-ChildItem -Recurse installers | Format-Table Name, Length
          $nsis = Get-ChildItem installers -Filter *.exe -Recurse
          $msi = Get-ChildItem installers -Filter *.msi -Recurse
          if ($nsis.Count -eq 0) { Write-Error "No NSIS installer found"; exit 1 }
          if ($msi.Count -eq 0) { Write-Error "No MSI installer found"; exit 1 }
          Write-Output "NSIS: $($nsis[0].Name) ($([math]::Round($nsis[0].Length/1MB, 1)) MB)"
          Write-Output "MSI:  $($msi[0].Name) ($([math]::Round($msi[0].Length/1MB, 1)) MB)"
