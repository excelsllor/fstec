server {
    # nginx-unprivileged: слушаем 8080 (непривилегированный порт), наружу маппится FSTEC_HTTP_PORT.
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Security-заголовки для статики и API (для API дублируются приложением).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # API gateway: префикс /gw снимается (baseURL фронтенда = /gw).
    location /gw/ {
        proxy_pass http://api-gateway:8666/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA (react-router): всё остальное отдаём index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
