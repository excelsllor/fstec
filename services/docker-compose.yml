services:
  kafka:
    # bitnami/kafka:3.7 снят с публикации; используется поддерживаемый legacy-репозиторий
    # с тем же набором переменных KAFKA_CFG_*.
    image: bitnamilegacy/kafka:3.7
    container_name: fstec-kafka
    restart: unless-stopped
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=${FSTEC_KAFKA_PARTITIONS:-12}
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=${FSTEC_KAFKA_REPLICATION_FACTOR:-1}
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fstec-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD обязателен}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: fstec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fstec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-fstec}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fstec}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Инференс LLM (Qwen3.5-9B) на GPU. Веса скачиваются при первом старте (нужен интернет).
  vllm:
    image: vllm/vllm-openai:v0.9.0
    container_name: fstec-vllm
    restart: unless-stopped
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL_ID:-Qwen/Qwen3.5-9B}
      --served-model-name ${VLLM_MODEL:-Qwen3.5-9B}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.80}
      --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s

  api-gateway:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: api_gateway } }
    container_name: fstec-api-gateway
    restart: unless-stopped
    depends_on: [kafka, redis, postgres]
    environment: &base-env
      FSTEC_ENV: prod
      FSTEC_EVENT_BUS: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fstec}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}@postgres:5432/${POSTGRES_DB:-fstec}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD обязателен}@redis:6379/0
      FSTEC_SECRET_KEY: ${FSTEC_SECRET_KEY:?FSTEC_SECRET_KEY обязателен — задайте уникальный секрет}
      FSTEC_DISABLE_DOCS: "1"
      FSTEC_DATA_DIR: /app/data
      FSTEC_GATEWAY_PORT: "8666"
      # LLM-план ответа: /reply/generate вызывает plan_reply -> llm_service.provider.get_provider().
      # Без vllm-провайдера план молча деградирует до шаблона (plan_json.llm = false).
      FSTEC_LLM_PROVIDER: ${FSTEC_LLM_PROVIDER:-vllm}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen3.5-9B}
      FSTEC_LLM_TIMEOUT_S: ${FSTEC_LLM_TIMEOUT_S:-300}
      # Этап 4 — bounded concurrency. Один консьюмер читает столько партиций,
      # сколько ему назначено, поэтому реальный параллелизм упирается в число
      # партиций (FSTEC_KAFKA_PARTITIONS), а BUS_CONCURRENCY — жёсткий потолок.
      FSTEC_BUS_CONCURRENCY: ${FSTEC_BUS_CONCURRENCY:-8}
      FSTEC_BUS_BATCH: ${FSTEC_BUS_BATCH:-100}
      FSTEC_KAFKA_PARTITIONS: ${FSTEC_KAFKA_PARTITIONS:-12}
      FSTEC_KAFKA_GROUP: ${FSTEC_KAFKA_GROUP:-fstec}
      # Пул БД: обработчики держат сессию во время ожидания vLLM.
      FSTEC_DB_POOL_SIZE: ${FSTEC_DB_POOL_SIZE:-10}
      FSTEC_DB_MAX_OVERFLOW: ${FSTEC_DB_MAX_OVERFLOW:-20}
      # CMDB/GLPI: gateway использует для вкладки «Диагностика», security — для инвентаря ПО
      CMDB_PROVIDER: ${CMDB_PROVIDER:-rest}
      GLPI_URL: ${GLPI_URL:-}
      GLPI_API: ${GLPI_API:-v1}
    volumes:
      - data:/app/data
    ports:
      - "127.0.0.1:8666:8666"
    command: ["uvicorn", "api_gateway.main:app", "--host", "0.0.0.0", "--port", "8666",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8666/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingest-service:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: ingest_service, WITH_OCR: "true" }
    container_name: fstec-ingest
    restart: unless-stopped
    depends_on: [kafka, redis, postgres]
    environment:
      <<: *base-env
      FSTEC_OCR_ENABLED: ${FSTEC_OCR_ENABLED:-true}
      FSTEC_OCR_ENGINE: ${FSTEC_OCR_ENGINE:-paddle}
      FSTEC_OCR_DEVICE: ${FSTEC_OCR_DEVICE:-gpu}
    # Разбор файлов и OCR — тяжёлые блокирующие операции; они выполняются в
    # пуле потоков (shared.concurrency.run_blocking), поэтому несколько писем
    # разбираются одновременно и не блокируют приём событий.
    command: ["python", "-m", "ingest_service.worker"]
    volumes:
      - data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llm-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: llm_service } }
    container_name: fstec-llm
    restart: unless-stopped
    depends_on: [kafka, redis, postgres, vllm]
    environment:
      <<: *base-env
      FSTEC_LLM_PROVIDER: ${FSTEC_LLM_PROVIDER:-vllm}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen3.5-9B}
      FSTEC_RUBERT_MODEL: ${FSTEC_RUBERT_MODEL:-DeepPavlov/rubert-base-cased-conversational}
      FSTEC_RUBERT_DEVICE: ${FSTEC_RUBERT_DEVICE:-cpu}
      # Потолок одновременных запросов в vLLM. Держим его на уровне, который
      # реально переваривает T4 (measured AWQ: concurrency 10-12), иначе
      # очередь запросов в vLLM растёт и p99 взлетает.
      FSTEC_LLM_CONCURRENCY: ${FSTEC_LLM_CONCURRENCY:-8}
      FSTEC_LLM_POOL_MAX: ${FSTEC_LLM_POOL_MAX:-16}
      FSTEC_LLM_WARMUP_ENABLED: ${FSTEC_LLM_WARMUP_ENABLED:-1}
      FSTEC_LLM_WARMUP_INTERVAL_S: ${FSTEC_LLM_WARMUP_INTERVAL_S:-300}
      FSTEC_LLM_WARMUP_TIMEOUT_S: ${FSTEC_LLM_WARMUP_TIMEOUT_S:-60}
      FSTEC_BUS_CONCURRENCY: ${FSTEC_LLM_BUS_CONCURRENCY:-10}
      FSTEC_DB_POOL_SIZE: ${FSTEC_LLM_DB_POOL_SIZE:-12}
      FSTEC_DB_MAX_OVERFLOW: ${FSTEC_LLM_DB_MAX_OVERFLOW:-20}
    command: ["python", "-m", "llm_service.worker"]
    volumes:
      - data:/app/data

  security-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: security_service } }
    container_name: fstec-security
    restart: unless-stopped
    depends_on: [kafka, redis, postgres]
    environment:
      <<: *base-env
      FSTEC_SECURITY_MODE: ${FSTEC_SECURITY_MODE:-live}
      FSTEC_SECURITY_RETRY_MAX: ${FSTEC_SECURITY_RETRY_MAX:-3}
      FSTEC_SECURITY_CACHE_TTL_S: ${FSTEC_SECURITY_CACHE_TTL_S:-86400}
      NVD_API_BASE: ${NVD_API_BASE:-https://services.nvd.nist.gov}
      NVD_API_KEY: ${NVD_API_KEY:-}
      BDU_API_BASE: ${BDU_API_BASE:-https://bdu.fstec.ru}
      FSTEC_BDU_INSECURE_FALLBACK: ${FSTEC_BDU_INSECURE_FALLBACK:-0}
      CMDB_PROVIDER: ${CMDB_PROVIDER:-rest}
      CMDB_ENDPOINT: ${CMDB_ENDPOINT:-http://localhost:9000/api/inventory/software}
      CMDB_AUTH_TYPE: ${CMDB_AUTH_TYPE:-none}
      CMDB_AUTH_TOKEN: ${CMDB_AUTH_TOKEN:-}
      CMDB_TIMEOUT_S: ${CMDB_TIMEOUT_S:-5}
      # GLPI как CMDB (CMDB_PROVIDER=glpi)
      GLPI_AUTH: ${GLPI_AUTH:-basic}
      GLPI_USERNAME: ${GLPI_USERNAME:-}
      GLPI_PASSWORD: ${GLPI_PASSWORD:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      GLPI_CLIENT_ID: ${GLPI_CLIENT_ID:-}
      GLPI_CLIENT_SECRET: ${GLPI_CLIENT_SECRET:-}
      GLPI_SCOPE: ${GLPI_SCOPE:-api}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_TIMEOUT_S: ${GLPI_TIMEOUT_S:-8}
      GLPI_MAX_SOFTWARE: ${GLPI_MAX_SOFTWARE:-5}
      GLPI_MAX_VERSIONS: ${GLPI_MAX_VERSIONS:-25}
      # Воркер обрабатывает несколько писем одновременно; внутри каждого письма
      # уязвимости обогащаются пачками по этому лимиту, чтобы не ловить 429 от NVD.
      FSTEC_SECURITY_CONCURRENCY: ${FSTEC_SECURITY_CONCURRENCY:-6}
      FSTEC_SECURITY_POOL_MAX: ${FSTEC_SECURITY_POOL_MAX:-12}
      FSTEC_BUS_CONCURRENCY: ${FSTEC_SECURITY_BUS_CONCURRENCY:-6}
      FSTEC_DB_POOL_SIZE: ${FSTEC_SECURITY_DB_POOL_SIZE:-10}
    command: ["python", "-m", "security_service.worker"]
    volumes:
      - data:/app/data

  reporting-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: reporting_service } }
    container_name: fstec-reporting
    restart: unless-stopped
    depends_on: [kafka, redis, postgres]
    environment:
      <<: *base-env
      FSTEC_ORG_NAME: ${FSTEC_ORG_NAME:-Правительства Липецкой области}
      # Тот же LLM-план, что и в gateway: worker строит проект ответа через
      # templated_reply.generate_reply -> plan_reply. Без провайдера — шаблон.
      FSTEC_LLM_PROVIDER: ${FSTEC_LLM_PROVIDER:-vllm}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen3.5-9B}
      FSTEC_LLM_TIMEOUT_S: ${FSTEC_LLM_TIMEOUT_S:-300}
      # Планирование ответа держит и сессию БД, и ожидание vLLM — пул и
      # конкурентность согласованы с llm-service, иначе reporting станет узким
      # местом пайплайна.
      FSTEC_LLM_CONCURRENCY: ${FSTEC_LLM_CONCURRENCY:-8}
      FSTEC_BUS_CONCURRENCY: ${FSTEC_REPORTING_BUS_CONCURRENCY:-10}
      FSTEC_DB_POOL_SIZE: ${FSTEC_REPORTING_DB_POOL_SIZE:-12}
      FSTEC_DB_MAX_OVERFLOW: ${FSTEC_REPORTING_DB_MAX_OVERFLOW:-20}
    command: ["python", "-m", "reporting_service.worker"]
    volumes:
      - data:/app/data

  # UI: отдаёт статику SPA и проксирует API на gateway (единый порт 80 для клиентов в локалке).
  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /gw
    container_name: fstec-nginx
    restart: unless-stopped
    depends_on: [api-gateway]
    ports:
      - "${FSTEC_HTTP_PORT:-80}:8080"

volumes:
  pgdata:
  redisdata:
  data:
  hf_cache:
