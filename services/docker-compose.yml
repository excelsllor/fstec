services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: fstec-kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fstec-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: fstec-postgres
    environment:
      POSTGRES_USER: fstec
      POSTGRES_PASSWORD: fstec
      POSTGRES_DB: fstec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fstec"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: api_gateway } }
    container_name: fstec-api-gateway
    depends_on: [kafka, redis, postgres]
    environment: &base-env
      FSTEC_EVENT_BUS: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql+psycopg2://fstec:fstec@postgres:5432/fstec
      FSTEC_SECRET_KEY: ${FSTEC_SECRET_KEY:-dev-insecure-change-me}
      FSTEC_DATA_DIR: /app/data
      FSTEC_GATEWAY_PORT: "8666"
    ports:
      - "8666:8666"
    command: ["uvicorn", "api_gateway.main:app", "--host", "0.0.0.0", "--port", "8666"]

  ingest-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: ingest_service } }
    container_name: fstec-ingest
    depends_on: [kafka, redis, postgres]
    environment:
      <<: *base-env
      FSTEC_OCR_ENABLED: "true"
      FSTEC_OCR_ENGINE: paddle
      FSTEC_OCR_DEVICE: gpu
    command: ["python", "-m", "ingest_service.worker"]
    volumes:
      - data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llm-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: llm_service } }
    container_name: fstec-llm
    depends_on: [kafka, redis, postgres]
    environment:
      <<: *base-env
      FSTEC_LLM_PROVIDER: ${FSTEC_LLM_PROVIDER:-heuristic}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
      FSTEC_RUBERT_MODEL: ${FSTEC_RUBERT_MODEL:-DeepPavlov/rubert-base-cased-conversational}
      FSTEC_RUBERT_DEVICE: cpu
    command: ["python", "-m", "llm_service.worker"]
    volumes:
      - data:/app/data

  security-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: security_service } }
    container_name: fstec-security
    depends_on: [kafka, redis, postgres]
    environment:
      <<: *base-env
      FSTEC_SECURITY_MODE: ${FSTEC_SECURITY_MODE:-mock}
      FSTEC_SECURITY_RETRY_MAX: ${FSTEC_SECURITY_RETRY_MAX:-3}
      FSTEC_SECURITY_CACHE_TTL_S: ${FSTEC_SECURITY_CACHE_TTL_S:-86400}
      NVD_API_BASE: ${NVD_API_BASE:-https://services.nvd.nist.gov}
      NVD_API_KEY: ${NVD_API_KEY:-}
      BDU_API_BASE: ${BDU_API_BASE:-https://bdu.fstec.ru}
      CMDB_PROVIDER: ${CMDB_PROVIDER:-mock}
      CMDB_ENDPOINT: ${CMDB_ENDPOINT:-http://localhost:9000/api/inventory/software}
      CMDB_AUTH_TYPE: ${CMDB_AUTH_TYPE:-none}
      CMDB_AUTH_TOKEN: ${CMDB_AUTH_TOKEN:-}
      CMDB_TIMEOUT_S: ${CMDB_TIMEOUT_S:-5}
    command: ["python", "-m", "security_service.worker"]
    volumes:
      - data:/app/data

  reporting-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: reporting_service } }
    container_name: fstec-reporting
    depends_on: [kafka, redis, postgres]
    environment:
      <<: *base-env
      FSTEC_ORG_NAME: ${FSTEC_ORG_NAME:-Организация Заказчика}
    command: ["python", "-m", "reporting_service.worker"]
    volumes:
      - data:/app/data

volumes:
  pgdata:
  data: