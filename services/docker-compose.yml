services:
  kafka:
    image: bitnamilegacy/kafka:3.9
    container_name: fstec-kafka
    restart: unless-stopped
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:SASL_SSL
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CLIENT_USERS=${KAFKA_SASL_USERNAME:-fstec}
      - KAFKA_CLIENT_PASSWORDS=${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD is required}
      - KAFKA_INTER_BROKER_USER=${KAFKA_INTER_BROKER_USER:-fstec-broker}
      - KAFKA_INTER_BROKER_PASSWORD=${KAFKA_INTER_BROKER_PASSWORD:?KAFKA_INTER_BROKER_PASSWORD is required}
      - KAFKA_TLS_TYPE=PEM
      - KAFKA_TLS_CLIENT_AUTH=none
      - KAFKA_TLS_TRUSTSTORE_FILE=/bitnami/kafka/config/certs/kafka.truststore.pem
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=${FSTEC_KAFKA_PARTITIONS:-12}
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=${FSTEC_KAFKA_REPLICATION_FACTOR:-1}
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
      - ../certs/kafka.keystore.pem:/bitnami/kafka/config/certs/kafka.keystore.pem:ro
      - ../certs/kafka.keystore.key:/bitnami/kafka/config/certs/kafka.keystore.key:ro
      - ../certs/ca.crt:/bitnami/kafka/config/certs/kafka.truststore.pem:ro
      - ./tools/kafka-healthcheck.sh:/usr/local/bin/kafka-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/kafka-healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: fstec-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD РѕР±СЏР·Р°С‚РµР»РµРЅ}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: fstec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fstec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD РѕР±СЏР·Р°С‚РµР»РµРЅ}
      POSTGRES_DB: ${POSTGRES_DB:-fstec}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fstec}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # РРЅС„РµСЂРµРЅСЃ LLM (Qwen3.5-9B) РЅР° GPU. Р’РµСЃР° СЃРєР°С‡РёРІР°СЋС‚СЃСЏ РїСЂРё РїРµСЂРІРѕРј СЃС‚Р°СЂС‚Рµ (РЅСѓР¶РµРЅ РёРЅС‚РµСЂРЅРµС‚).
  vllm:
    image: vllm/vllm-openai:v0.9.0
    container_name: fstec-vllm
    restart: unless-stopped
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL_ID:-Qwen/Qwen3.5-9B}
      --served-model-name ${VLLM_MODEL:-Qwen3.5-9B}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.80}
      --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s

  vllm-proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    container_name: fstec-vllm-proxy
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./vllm-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs/vllm.crt:/etc/nginx/certs/vllm.crt:ro
      - ../certs/vllm.key:/etc/nginx/certs/vllm.key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  api-gateway:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: api_gateway } }
    container_name: fstec-api-gateway
    restart: unless-stopped
    depends_on: [kafka, redis, postgres]
    environment: &base-env
      FSTEC_ENV: prod
      FSTEC_EVENT_BUS: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_SSL}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-fstec}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD is required}
      KAFKA_SSL_CA_FILE: /etc/fstec/kafka-ca.crt
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fstec}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD РѕР±СЏР·Р°С‚РµР»РµРЅ}@postgres:5432/${POSTGRES_DB:-fstec}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD РѕР±СЏР·Р°С‚РµР»РµРЅ}@redis:6379/0
      FSTEC_SECRET_KEY: ${FSTEC_SECRET_KEY:?FSTEC_SECRET_KEY РѕР±СЏР·Р°С‚РµР»РµРЅ вЂ” Р·Р°РґР°Р№С‚Рµ СѓРЅРёРєР°Р»СЊРЅС‹Р№ СЃРµРєСЂРµС‚}
      FSTEC_DISABLE_DOCS: "1"
      FSTEC_DATA_DIR: /app/data
      FSTEC_GATEWAY_PORT: "8666"
      # LLM-РїР»Р°РЅ РѕС‚РІРµС‚Р°: /reply/generate РІС‹Р·С‹РІР°РµС‚ plan_reply -> llm_service.provider.get_provider().
      # Р‘РµР· vllm-РїСЂРѕРІР°Р№РґРµСЂР° РїР»Р°РЅ РјРѕР»С‡Р° РґРµРіСЂР°РґРёСЂСѓРµС‚ РґРѕ С€Р°Р±Р»РѕРЅР° (plan_json.llm = false).
      FSTEC_LLM_PROVIDER: ${FSTEC_LLM_PROVIDER:-vllm}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
      VLLM_CA_FILE: ${VLLM_CA_FILE:-}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen3.5-9B}
      FSTEC_LLM_TIMEOUT_S: ${FSTEC_LLM_TIMEOUT_S:-300}
      FSTEC_PLAN_MAX_TOKENS: ${FSTEC_PLAN_MAX_TOKENS:-4000}
      FSTEC_LLM_MERGED_ANALYZE: ${FSTEC_LLM_MERGED_ANALYZE:-0}
      FSTEC_LLM_MERGED_IOCS: ${FSTEC_LLM_MERGED_IOCS:-1}
      FSTEC_BERT_PRIMARY_IOCS: ${FSTEC_BERT_PRIMARY_IOCS:-0}
      FSTEC_DEDUPE_PROMPT_LINES: ${FSTEC_DEDUPE_PROMPT_LINES:-0}
      FSTEC_LLM_DISABLE_GUIDED: ${FSTEC_LLM_DISABLE_GUIDED:-0}
      FSTEC_LLM_GUIDED_FALLBACK: ${FSTEC_LLM_GUIDED_FALLBACK:-0}
      FSTEC_PLAN_CACHE: ${FSTEC_PLAN_CACHE:-0}
      FSTEC_REPLY_LLM_MODE: ${FSTEC_REPLY_LLM_MODE:-always}
      # Р­С‚Р°Рї 4 вЂ” bounded concurrency. РћРґРёРЅ РєРѕРЅСЃСЊСЋРјРµСЂ С‡РёС‚Р°РµС‚ СЃС‚РѕР»СЊРєРѕ РїР°СЂС‚РёС†РёР№,
      # СЃРєРѕР»СЊРєРѕ РµРјСѓ РЅР°Р·РЅР°С‡РµРЅРѕ, РїРѕСЌС‚РѕРјСѓ СЂРµР°Р»СЊРЅС‹Р№ РїР°СЂР°Р»Р»РµР»РёР·Рј СѓРїРёСЂР°РµС‚СЃСЏ РІ С‡РёСЃР»Рѕ
      # РїР°СЂС‚РёС†РёР№ (FSTEC_KAFKA_PARTITIONS), Р° BUS_CONCURRENCY вЂ” Р¶С‘СЃС‚РєРёР№ РїРѕС‚РѕР»РѕРє.
      FSTEC_BUS_CONCURRENCY: ${FSTEC_BUS_CONCURRENCY:-8}
      FSTEC_BUS_BATCH: ${FSTEC_BUS_BATCH:-100}
      FSTEC_KAFKA_PARTITIONS: ${FSTEC_KAFKA_PARTITIONS:-12}
      FSTEC_KAFKA_GROUP: ${FSTEC_KAFKA_GROUP:-fstec}
      # РџСѓР» Р‘Р”: РѕР±СЂР°Р±РѕС‚С‡РёРєРё РґРµСЂР¶Р°С‚ СЃРµСЃСЃРёСЋ РІРѕ РІСЂРµРјСЏ РѕР¶РёРґР°РЅРёСЏ vLLM.
      FSTEC_DB_POOL_SIZE: ${FSTEC_DB_POOL_SIZE:-10}
      FSTEC_DB_MAX_OVERFLOW: ${FSTEC_DB_MAX_OVERFLOW:-20}
      # CMDB/GLPI: gateway РёСЃРїРѕР»СЊР·СѓРµС‚ РґР»СЏ РІРєР»Р°РґРєРё В«Р”РёР°РіРЅРѕСЃС‚РёРєР°В», security вЂ” РґР»СЏ РёРЅРІРµРЅС‚Р°СЂСЏ РџРћ
      CMDB_PROVIDER: ${CMDB_PROVIDER:-rest}
      GLPI_URL: ${GLPI_URL:-}
      GLPI_API: ${GLPI_API:-v1}
    configs:
      - source: kafka_ca
        target: /etc/fstec/kafka-ca.crt
      - source: vllm_ca
        target: /etc/fstec/vllm-ca.crt
    volumes:
      - data:/app/data
    ports:
      - "127.0.0.1:8666:8666"
    command: ["uvicorn", "api_gateway.main:app", "--host", "0.0.0.0", "--port", "8666",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8666/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingest-service:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: ingest_service, WITH_OCR: "${FSTEC_WITH_OCR:-false}" }
    container_name: fstec-ingest
    restart: unless-stopped
    depends_on: [kafka, redis, postgres]
    environment:
      <<: *base-env
      FSTEC_OCR_ENABLED: ${FSTEC_OCR_ENABLED:-true}
      FSTEC_OCR_ENGINE: ${FSTEC_OCR_ENGINE:-tesseract}
      FSTEC_OCR_DEVICE: ${FSTEC_OCR_DEVICE:-cpu}
    # Р Р°Р·Р±РѕСЂ С„Р°Р№Р»РѕРІ Рё OCR вЂ” С‚СЏР¶С‘Р»С‹Рµ Р±Р»РѕРєРёСЂСѓСЋС‰РёРµ РѕРїРµСЂР°С†РёРё; РѕРЅРё РІС‹РїРѕР»РЅСЏСЋС‚СЃСЏ РІ
    # РїСѓР»Рµ РїРѕС‚РѕРєРѕРІ (shared.concurrency.run_blocking), РїРѕСЌС‚РѕРјСѓ РЅРµСЃРєРѕР»СЊРєРѕ РїРёСЃРµРј
    # СЂР°Р·Р±РёСЂР°СЋС‚СЃСЏ РѕРґРЅРѕРІСЂРµРјРµРЅРЅРѕ Рё РЅРµ Р±Р»РѕРєРёСЂСѓСЋС‚ РїСЂРёС‘Рј СЃРѕР±С‹С‚РёР№.
    command: ["python", "-m", "ingest_service.worker"]
    configs:
      - source: kafka_ca
        target: /etc/fstec/kafka-ca.crt
      - source: vllm_ca
        target: /etc/fstec/vllm-ca.crt
    volumes:
      - data:/app/data
      - paddle_cache:/home/appuser/.paddleocr

  llm-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: llm_service } }
    container_name: fstec-llm
    restart: unless-stopped
    depends_on: [kafka, redis, postgres, vllm]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *base-env
      FSTEC_LLM_PROVIDER: ${FSTEC_LLM_PROVIDER:-vllm}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
      VLLM_CA_FILE: ${VLLM_CA_FILE:-}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen3.5-9B}
      FSTEC_RUBERT_MODEL: ${FSTEC_RUBERT_MODEL:-DeepPavlov/rubert-base-cased-conversational}
      FSTEC_RUBERT_DEVICE: ${FSTEC_RUBERT_DEVICE:-cpu}
      # РџРѕС‚РѕР»РѕРє РѕРґРЅРѕРІСЂРµРјРµРЅРЅС‹С… Р·Р°РїСЂРѕСЃРѕРІ РІ vLLM. Р”РµСЂР¶РёРј РµРіРѕ РЅР° СѓСЂРѕРІРЅРµ, РєРѕС‚РѕСЂС‹Р№
      # СЂРµР°Р»СЊРЅРѕ РїРµСЂРµРІР°СЂРёРІР°РµС‚ T4 (measured AWQ: concurrency 10-12), РёРЅР°С‡Рµ
      # РѕС‡РµСЂРµРґСЊ Р·Р°РїСЂРѕСЃРѕРІ РІ vLLM СЂР°СЃС‚С‘С‚ Рё p99 РІР·Р»РµС‚Р°РµС‚.
      FSTEC_LLM_CONCURRENCY: ${FSTEC_LLM_CONCURRENCY:-8}
      FSTEC_REPLY_LLM_MODE: ${FSTEC_REPLY_LLM_MODE:-always}
      FSTEC_LLM_POOL_MAX: ${FSTEC_LLM_POOL_MAX:-16}
      FSTEC_LLM_WARMUP_ENABLED: ${FSTEC_LLM_WARMUP_ENABLED:-1}
      FSTEC_LLM_WARMUP_INTERVAL_S: ${FSTEC_LLM_WARMUP_INTERVAL_S:-300}
      FSTEC_LLM_WARMUP_TIMEOUT_S: ${FSTEC_LLM_WARMUP_TIMEOUT_S:-60}
      FSTEC_BUS_CONCURRENCY: ${FSTEC_LLM_BUS_CONCURRENCY:-10}
      FSTEC_DB_POOL_SIZE: ${FSTEC_LLM_DB_POOL_SIZE:-12}
      FSTEC_DB_MAX_OVERFLOW: ${FSTEC_LLM_DB_MAX_OVERFLOW:-20}
    command: ["python", "-m", "llm_service.worker"]
    configs:
      - source: kafka_ca
        target: /etc/fstec/kafka-ca.crt
      - source: vllm_ca
        target: /etc/fstec/vllm-ca.crt
    volumes:
      - data:/app/data

  security-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: security_service } }
    container_name: fstec-security
    restart: unless-stopped
    depends_on: [kafka, redis, postgres]
    environment:
      <<: *base-env
      FSTEC_SECURITY_MODE: ${FSTEC_SECURITY_MODE:-live}
      FSTEC_SECURITY_RETRY_MAX: ${FSTEC_SECURITY_RETRY_MAX:-3}
      FSTEC_SECURITY_CACHE_TTL_S: ${FSTEC_SECURITY_CACHE_TTL_S:-86400}
      NVD_API_BASE: ${NVD_API_BASE:-https://services.nvd.nist.gov}
      NVD_API_KEY: ${NVD_API_KEY:-}
      BDU_API_BASE: ${BDU_API_BASE:-https://bdu.fstec.ru}
      FSTEC_BDU_INSECURE_FALLBACK: ${FSTEC_BDU_INSECURE_FALLBACK:-0}
      CMDB_PROVIDER: ${CMDB_PROVIDER:-rest}
      CMDB_ENDPOINT: ${CMDB_ENDPOINT:-http://localhost:9000/api/inventory/software}
      CMDB_AUTH_TYPE: ${CMDB_AUTH_TYPE:-none}
      CMDB_AUTH_TOKEN: ${CMDB_AUTH_TOKEN:-}
      CMDB_TIMEOUT_S: ${CMDB_TIMEOUT_S:-5}
      # GLPI РєР°Рє CMDB (CMDB_PROVIDER=glpi)
      GLPI_AUTH: ${GLPI_AUTH:-basic}
      GLPI_USERNAME: ${GLPI_USERNAME:-}
      GLPI_PASSWORD: ${GLPI_PASSWORD:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      GLPI_CLIENT_ID: ${GLPI_CLIENT_ID:-}
      GLPI_CLIENT_SECRET: ${GLPI_CLIENT_SECRET:-}
      GLPI_SCOPE: ${GLPI_SCOPE:-api}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_TIMEOUT_S: ${GLPI_TIMEOUT_S:-8}
      GLPI_MAX_SOFTWARE: ${GLPI_MAX_SOFTWARE:-5}
      GLPI_MAX_VERSIONS: ${GLPI_MAX_VERSIONS:-25}
      # Р’РѕСЂРєРµСЂ РѕР±СЂР°Р±Р°С‚С‹РІР°РµС‚ РЅРµСЃРєРѕР»СЊРєРѕ РїРёСЃРµРј РѕРґРЅРѕРІСЂРµРјРµРЅРЅРѕ; РІРЅСѓС‚СЂРё РєР°Р¶РґРѕРіРѕ РїРёСЃСЊРјР°
      # СѓСЏР·РІРёРјРѕСЃС‚Рё РѕР±РѕРіР°С‰Р°СЋС‚СЃСЏ РїР°С‡РєР°РјРё РїРѕ СЌС‚РѕРјСѓ Р»РёРјРёС‚Сѓ, С‡С‚РѕР±С‹ РЅРµ Р»РѕРІРёС‚СЊ 429 РѕС‚ NVD.
      FSTEC_SECURITY_CONCURRENCY: ${FSTEC_SECURITY_CONCURRENCY:-6}
      FSTEC_SECURITY_POOL_MAX: ${FSTEC_SECURITY_POOL_MAX:-12}
      FSTEC_BUS_CONCURRENCY: ${FSTEC_SECURITY_BUS_CONCURRENCY:-6}
      FSTEC_DB_POOL_SIZE: ${FSTEC_SECURITY_DB_POOL_SIZE:-10}
    command: ["python", "-m", "security_service.worker"]
    configs:
      - source: kafka_ca
        target: /etc/fstec/kafka-ca.crt
      - source: vllm_ca
        target: /etc/fstec/vllm-ca.crt
    volumes:
      - data:/app/data

  audit-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: audit_service } }
    container_name: fstec-audit
    restart: unless-stopped
    depends_on: [kafka, postgres]
    environment:
      <<: *base-env
      FSTEC_BUS_CONCURRENCY: ${FSTEC_AUDIT_BUS_CONCURRENCY:-2}
      FSTEC_DB_POOL_SIZE: ${FSTEC_AUDIT_DB_POOL_SIZE:-4}
    command: ["python", "-m", "audit_service.worker"]
    configs:
      - source: kafka_ca
        target: /etc/fstec/kafka-ca.crt
      - source: vllm_ca
        target: /etc/fstec/vllm-ca.crt

  reporting-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: reporting_service } }
    container_name: fstec-reporting
    restart: unless-stopped
    depends_on: [kafka, redis, postgres]
    environment:
      <<: *base-env
      FSTEC_ORG_NAME: ${FSTEC_ORG_NAME:-РџСЂР°РІРёС‚РµР»СЊСЃС‚РІР° Р›РёРїРµС†РєРѕР№ РѕР±Р»Р°СЃС‚Рё}
      # РўРѕС‚ Р¶Рµ LLM-РїР»Р°РЅ, С‡С‚Рѕ Рё РІ gateway: worker СЃС‚СЂРѕРёС‚ РїСЂРѕРµРєС‚ РѕС‚РІРµС‚Р° С‡РµСЂРµР·
      # templated_reply.generate_reply -> plan_reply. Р‘РµР· РїСЂРѕРІР°Р№РґРµСЂР° вЂ” С€Р°Р±Р»РѕРЅ.
      FSTEC_LLM_PROVIDER: ${FSTEC_LLM_PROVIDER:-vllm}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
      VLLM_CA_FILE: ${VLLM_CA_FILE:-}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen3.5-9B}
      FSTEC_LLM_TIMEOUT_S: ${FSTEC_LLM_TIMEOUT_S:-300}
      FSTEC_PLAN_MAX_TOKENS: ${FSTEC_PLAN_MAX_TOKENS:-4000}
      # РџР»Р°РЅРёСЂРѕРІР°РЅРёРµ РѕС‚РІРµС‚Р° РґРµСЂР¶РёС‚ Рё СЃРµСЃСЃРёСЋ Р‘Р”, Рё РѕР¶РёРґР°РЅРёРµ vLLM вЂ” РїСѓР» Рё
      # РєРѕРЅРєСѓСЂРµРЅС‚РЅРѕСЃС‚СЊ СЃРѕРіР»Р°СЃРѕРІР°РЅС‹ СЃ llm-service, РёРЅР°С‡Рµ reporting СЃС‚Р°РЅРµС‚ СѓР·РєРёРј
      # РјРµСЃС‚РѕРј РїР°Р№РїР»Р°Р№РЅР°.
      FSTEC_LLM_CONCURRENCY: ${FSTEC_LLM_CONCURRENCY:-8}
      FSTEC_REPLY_LLM_MODE: ${FSTEC_REPLY_LLM_MODE:-always}
      FSTEC_BUS_CONCURRENCY: ${FSTEC_REPORTING_BUS_CONCURRENCY:-10}
      FSTEC_DB_POOL_SIZE: ${FSTEC_REPORTING_DB_POOL_SIZE:-12}
      FSTEC_DB_MAX_OVERFLOW: ${FSTEC_REPORTING_DB_MAX_OVERFLOW:-20}
    command: ["python", "-m", "reporting_service.worker"]
    configs:
      - source: kafka_ca
        target: /etc/fstec/kafka-ca.crt
      - source: vllm_ca
        target: /etc/fstec/vllm-ca.crt
    volumes:
      - data:/app/data

  # UI: РѕС‚РґР°С‘С‚ СЃС‚Р°С‚РёРєСѓ SPA Рё РїСЂРѕРєСЃРёСЂСѓРµС‚ API РЅР° gateway (РµРґРёРЅС‹Р№ РїРѕСЂС‚ 80 РґР»СЏ РєР»РёРµРЅС‚РѕРІ РІ Р»РѕРєР°Р»РєРµ).
  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /gw
    container_name: fstec-nginx
    restart: unless-stopped
    depends_on: [api-gateway]
    ports:
      - "${FSTEC_HTTP_PORT:-80}:8080"
      - "${FSTEC_HTTPS_PORT:-443}:8443"
    volumes:
      - ../certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ../certs/server.key:/etc/nginx/certs/server.key:ro

configs:
  kafka_ca:
    file: ../certs/ca.crt
  vllm_ca:
    file: ../certs/ca.crt

volumes:
  pgdata:
  redisdata:
  data:
  paddle_cache:
  kafka_data:
  hf_cache:
